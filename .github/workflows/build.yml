# Builds the Android APK and the Windows installer.
# Push a tag like v1.0.1, or press "Run workflow", and both files appear under Releases.
name: Sestavení aplikací

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verze
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV; else echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> $GITHUB_ENV; fi
      - run: npm ci
      - run: npx cap sync android
      - name: Podpisový klíč z tajných proměnných
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KS_PASS" "$KS_ALIAS" "$KS_PASS" > android/keystore.properties
            echo "APK_KIND=release" >> $GITHUB_ENV
          else
            echo "::warning::Chybí tajné proměnné ANDROID_KEYSTORE_*, sestavuji ladicí (debug) APK."
            echo "APK_KIND=debug" >> $GITHUB_ENV
          fi
      - name: Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$APK_KIND" = release ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi
      - name: Přejmenovat APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/$APK_KIND/app-$APK_KIND.apk "out/${{ github.event.repository.name }}-${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  windows:
    name: Windows instalačka
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verze
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV; else echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> $GITHUB_ENV; fi
      - run: npm ci
      - name: electron-builder
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version="$VERSION_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*.exe

  release:
    name: Vydání
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Název vydání
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "TAG=$GITHUB_REF_NAME" >> $GITHUB_ENV; else echo "TAG=v$(node -p "require('./package.json').version")" >> $GITHUB_ENV; fi
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: false
          body: |
            **Android:** stáhni `.apk` do telefonu a otevři ho (poprvé povol instalaci z neznámých zdrojů).
            **Windows:** stáhni `-setup.exe` a spusť. Když se objeví modré okno SmartScreen, klikni na „Další informace“ a pak „Přesto spustit“.
